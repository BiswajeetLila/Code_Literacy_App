<!doctype html>
<!--
  index.html is still the front door. It now loads the app shell, and the
  TypeScript router decides which page to draw inside #view.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Literacy</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="sheet app-shell">
      <span class="reg tl"></span><span class="reg tr"></span>
      <span class="reg bl"></span><span class="reg br"></span>

      <header class="doc-head app-head">
        <p class="doc-tag">CODE LITERACY &middot; APP SHELL &middot; WEEK 1 OF 10</p>
        <div class="app-head-row">
          <div>
            <h1>Code Literacy</h1>
            <p class="subtitle">
              A reading-first course for understanding AI-generated code, debugging it,
              and steering the work with confidence.
            </p>
          </div>
          <a class="app-cta" href="#/week/01">Start Week 01</a>
        </div>
        <nav class="app-nav" aria-label="Primary">
          <a href="#/" data-route="home">Home</a>
          <a href="#/weeks" data-route="weeks">Weeks</a>
          <a href="#/glossary" data-route="glossary">Glossary</a>
          <a href="#/review" data-route="review">Review</a>
        </nav>
      </header>

      <main id="view" class="route-view" tabindex="-1"></main>

      <footer class="doc-foot">
        <span>DWG. CODE-LITERACY &middot; REV. APP-SHELL</span>
        <span>STATIC WEB APP</span>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
